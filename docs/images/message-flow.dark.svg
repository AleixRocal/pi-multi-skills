<rect x="40" y="600" width="1320" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6 6" />
<text x="64" y="630" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">A contiguous run still broadcasts: </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#79c0ff">/skill:a /skill:b shared args</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"> appends the argument text once, after the last block — exactly as native pi does.</tspan></text>
<text x="64" y="654" font-size="13" font-weight="normal" fill="#9198a1" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">A single </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#79c0ff">/skill:a args</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"> message is byte-identical to native pi, which is what keeps </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#79c0ff">@juicesharp/rpiv-args</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"> interchangeable in either handler order.</tspan></text>
</svg>
