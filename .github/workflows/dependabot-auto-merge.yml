name: Dependabot auto-merge

# Keeps dependency bumps moving without a maintainer in the loop, but only on
# the terms that cannot silently change what ships: a patch or minor bump of a
# DEV dependency. Anything else — a major, a runtime dependency, a hand-written
# PR — needs a human.
#
# This job enables GitHub's NATIVE auto-merge (`--auto`, never `--admin`), so
# GitHub itself waits for the required checks: the merge only happens once the
# CI workflow is green. That makes two repository settings load-bearing, and
# without them auto-merge would merge immediately instead of waiting. See
# CONTRIBUTING.md -> "Repository settings".
#
# Nothing here reads the PR's code — no checkout, no build — so the token is
# only ever used for PR metadata and labels.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # enable auto-merge
  pull-requests: write # comment and label
  issues: write # labels are the issues API

jobs:
  auto-merge:
    # `dependabot[bot]` is the only pull request author this workflow ever acts
    # on. The author is read from the PR itself, not from `github.actor`:
    # the actor of a `synchronize` event is whoever pushed to the branch.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # dependabot/fetch-metadata v2, pinned to the release commit.
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch/minor dev bump)
        if: |
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr merge --squash --auto "$PR_URL"
          gh pr comment "$PR_URL" --body \
            "Auto-merge enabled for this dev-dependency bump: squash
            \`$PR_TITLE\` once CI is green."

      - name: Flag the rest for review
        if: |
          steps.meta.outputs.dependency-type != 'direct:development' ||
          (steps.meta.outputs.update-type != 'version-update:semver-patch' &&
           steps.meta.outputs.update-type != 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          # Label creation and application are best-effort: a token minted for a
          # Dependabot-triggered run cannot always touch labels, and the comment
          # below is the signal that matters. Assert the outcome instead of the
          # exit code, so the run only warns when the label really is missing.
          gh label create needs-review || true
          gh pr edit "$PR_URL" --add-label needs-review >/dev/null 2>&1 || true
          if ! gh pr view "$PR_URL" --json labels \
            --jq '.labels[].name' | grep -qx needs-review; then
            echo "::warning::could not apply the needs-review label"
          fi
          gh pr comment "$PR_URL" --body \
            "Not auto-merging: \`$DEP_TYPE\` / \`$UPDATE_TYPE\`.
            A maintainer should review this one."
